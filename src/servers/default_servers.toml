# Bundled server list. Entries appear in the launcher's dropdown in the
# order below. `Localhost` points at the sibling garlemald-server's Rust
# login endpoint. `Project Meteor` points at the upstream PHP login_su
# web server that ships with the C# Project Meteor reference impl --
# handy when running it as a differential test against garlemald-server.

[[server]]
name = "Localhost"
address = "127.0.0.1"
login_url = "http://127.0.0.1:54993/login"

[[server]]
name = "Project Meteor"
address = "127.0.0.1"
login_url = "http://127.0.0.1:8080/login.php"

# The AetherXIV 1.3 docker stack in the sibling AetherXIV-EchoGate repo
# (its main working line). Lobby on the stock 54994 port; the PHP web
# container serves the login page on 8080. The page answers with the
# retail x-sqexauth element, which the login WebView bridges to
# ffxiv://login_success itself, so the normal Login flow works.
[[server]]
name = "AetherXIV 1.3 (Docker Local)"
address = "127.0.0.1"
login_url = "http://127.0.0.1:8080/login/index.php"
