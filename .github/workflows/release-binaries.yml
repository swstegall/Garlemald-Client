name: Release binaries

# Builds the launcher per platform in its idiomatic packaging and attaches the
# artifacts + SHA-256 checksums to the GitHub Release for the pushed vX.Y.Z tag.
# See issue #10. Kept consistent with Garlemald-Server's release-binaries.yml (#15),
# differing only in the desktop-native bundle formats (.app / .zip / .tar.gz).
#
# Pipeline (per merge to main): CI gate (#9) -> SemVer bump + tag push (#8,
# release.yml) -> THIS workflow. It fires on the tag push because release.yml pushes
# the tag with RELEASE_PAT (a PAT push triggers downstream workflows; the default
# GITHUB_TOKEN would not) and the tagged bump commit is NOT marked [skip ci].
# The matching Release is normally already created (notes-only) by release.yml; this
# workflow attaches the artifacts to it idempotently.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build + attach artifacts for, e.g. v0.1.1"
        required: true

# Per-tag group so re-runs/dispatches for one tag serialize, while different tags
# don't block each other. Distinct from release.yml's "release" group.
concurrency:
  group: release-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege: build jobs only read; the aggregator job is granted write.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `target` labels the artifact; `rust_target` is what the toolchain adds.
          # macOS produces ONE universal (.app) covering arm64 + Intel via
          # scripts/package-macos.sh --universal (aarch64 is the host; we add x86_64).
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, rust_target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,   target: universal-apple-darwin,   rust_target: x86_64-apple-darwin }
          # Windows ships 32-bit ONLY — the launcher patches the 32-bit ffxivgame.exe
          # by reading its thread context, which a 64-bit process can't do (src/lib.rs
          # rejects x86_64-pc-windows-msvc at compile time).
          - { os: windows-latest, target: i686-pc-windows-msvc,     rust_target: i686-pc-windows-msvc }
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout at the tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install pinned toolchain + target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # No `toolchain:` -> honors rust-toolchain.toml (1.95.0); add the matrix target.
          target: ${{ matrix.rust_target }}
          rustflags: ""
          cache: false

      - name: Cache cargo + target (per target)
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux is the only platform needing system libraries: wry/eframe link against
      # GTK3 / WebKit2GTK / X11 / wayland / GL. Windows and macOS use their OS-native
      # WebView frameworks (WebView2 / WKWebView) with no extra install. (Same set as ci.yml.)
      - name: Install Linux GUI/WebView system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev

      - name: Package (Linux — tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          target="${{ matrix.target }}"
          cargo build --release --locked --target "$target"
          name="garlemald-client-$tag-$target"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C "target/$target/release" garlemald-client
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist

      # ----- macOS: universal .app, optionally Developer ID-signed + notarized -----
      # Signing + notarization auto-activate when BOTH the cert and the App Store
      # Connect API key secrets are present; otherwise the leg falls back to today's
      # ad-hoc (unsigned) .app. See docs/RELEASING.md "macOS code signing".
      - name: Detect macOS signing secrets
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "${CERT_P12:-}" ] && [ -n "${ASC_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing + notarization: ENABLED (secrets present)."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets absent — building an ad-hoc (unsigned) .app. Gatekeeper will warn on download."
          fi

      - name: Import Developer ID cert into a temporary keychain
        id: importcert
        if: runner.os == 'macOS' && steps.macsign.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.MACOS_CERT_PWD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_PWD:-}" ]; then
            echo "::error::MACOS_CERT_PWD is empty. macOS 'security import' cannot import a passwordless .p12 (it fails MAC verification even with -P \"\"). Re-export the Developer ID cert from Keychain Access WITH an export password and set MACOS_CERT_PWD."
            exit 1
          fi
          KC="$RUNNER_TEMP/build.keychain-db"
          # Throwaway keychain password — generated per run (the keychain is created,
          # used, and deleted within this job), so it need not be a stored secret.
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"   # no auto-lock mid-run
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PWD" -T /usr/bin/codesign
          # Let codesign use the key non-interactively.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KC" >/dev/null
          # Make codesign find the identity. The search list alone is NOT enough —
          # codesign searches the DEFAULT keychain, so set ours as default, and also
          # prepend it to the search list (preserving existing entries; parsed
          # line-by-line so a path with whitespace can't word-split).
          security default-keychain -s "$KC"
          existing=()
          while IFS= read -r kc; do
            kc="$(printf '%s' "$kc" | sed -E 's/^[[:space:]]*"?//; s/"?[[:space:]]*$//')"
            [ -n "$kc" ] && existing+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KC" "${existing[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Derive the signing identity BY SHA-1 HASH straight from the keychain —
          # immune to any name-string mismatch (the other common "no identity found"
          # cause). codesign --sign accepts the hash directly. NOTE: no `-v` — that
          # filters to chain-VALID identities, which drops the cert if the runner is
          # missing the Apple intermediate; codesign only needs the cert+key (present).
          security find-identity -p codesigning "$KC"
          IDENTITY="$(security find-identity -p codesigning "$KC" | awk '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' code-signing identity found after import. Ensure the .p12 contains a Developer ID Application cert AND its private key."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Signing with identity (SHA-1): $IDENTITY"

      - name: Build + package the universal .app
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_ENABLED: ${{ steps.macsign.outputs.enabled }}
          # The SHA-1 hash derived from the imported cert (immune to name mismatch).
          SIGN_IDENTITY: ${{ steps.importcert.outputs.identity }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          name="garlemald-client-$tag-${{ matrix.target }}"
          # Pre-build BOTH slices with --locked so the (un-locked) cargo builds inside
          # package-macos.sh are no-ops — keeps the release reproducible (--locked) while
          # reusing the maintained .app packaging (Info.plist version, icon, lipo, signing).
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          if [ "${SIGN_ENABLED:-false}" = "true" ]; then
            # Developer ID-signed (hardened runtime + entitlements + timestamp via the script).
            scripts/package-macos.sh --universal --sign "$SIGN_IDENTITY"
          else
            scripts/package-macos.sh --universal   # ad-hoc (unsigned) fallback
          fi
          mkdir -p dist
          # ditto is the macOS-idiomatic way to zip a .app (preserves the bundle,
          # symlinks, and the code signature).
          ditto -c -k --keepParent "target/macos-app/Garlemald Client.app" "dist/$name.zip"
          echo "universal archs: $(lipo -archs 'target/macos-app/Garlemald Client.app/Contents/MacOS/garlemald-client')"

      - name: Notarize + staple the .app
        if: runner.os == 'macOS' && steps.macsign.outputs.enabled == 'true'
        shell: bash
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          name="garlemald-client-$tag-${{ matrix.target }}"
          app="target/macos-app/Garlemald Client.app"
          key="$RUNNER_TEMP/asc_key.p8"
          echo "$ASC_KEY" | base64 --decode > "$key"
          # Submit the (already-zipped) bundle and block on Apple's verdict.
          rc=0
          out="$(xcrun notarytool submit "dist/$name.zip" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait 2>&1)" || rc=$?
          echo "$out"
          if [ "$rc" != 0 ] || ! printf '%s' "$out" | grep -qi 'status: Accepted'; then
            sid="$(printf '%s\n' "$out" | awk -F': *' '/^[[:space:]]*id:/{print $2; exit}')"
            [ -n "$sid" ] && xcrun notarytool log "$sid" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::Notarization was not Accepted for $name (see the log above)."
            rm -f "$key"; exit 1
          fi
          # Staple the ticket so the app validates offline, then RE-ZIP (the
          # pre-notarization zip has no ticket) and re-checksum downstream.
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          rm -f "dist/$name.zip"
          ditto -c -k --keepParent "$app" "dist/$name.zip"
          # Final Gatekeeper gate: must accept as a Notarized Developer ID app.
          spctl -a -vvv -t exec "$app"
          rm -f "$key"

      - name: Checksum the macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          name="garlemald-client-$tag-${{ matrix.target }}"
          (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")
          ls -l dist

      - name: Clean up the signing keychain
        if: always() && runner.os == 'macOS' && steps.macsign.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/asc_key.p8" 2>/dev/null || true

      # aws-lc-sys (via librqbit -> aws-lc-rs for torrent-piece SHA-1) assembles its
      # crypto with NASM; the 32-bit Windows target has no prebuilt objects, so NASM
      # must be on PATH. choco is preinstalled on the windows-latest runner.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Package (Windows — .exe, zipped)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.tag.outputs.tag }}"
          $target = "${{ matrix.target }}"
          cargo build --release --locked --target $target
          $name = "garlemald-client-$tag-$target"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # winresource (build.rs) has already embedded the icon + version into the .exe.
          Compress-Archive -Path "target\$target\release\garlemald-client.exe" -DestinationPath "dist\$name.zip" -Force
          # Match the `<hash>  <file>` shape (lowercase, two spaces) so `sha256sum -c` works.
          $h = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          # LF-only, no BOM, so `sha256sum -c` on Linux accepts it.
          [IO.File]::WriteAllText("dist\$name.zip.sha256", "$h  $name.zip`n")
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach assets to the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          echo "Assets to attach:"; ls -l dist
          # release.yml (#8) usually created the (notes-only) release already; create if
          # missing (e.g. a workflow_dispatch rebuild). --verify-tag refuses to fabricate
          # a tag; the trailing `view` tolerates a create that lost a rare race.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes --verify-tag \
            || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          # --clobber replaces same-named assets so re-runs are idempotent.
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached $(ls dist | wc -l) files to release $tag"

      - name: Detect macOS signing (to phrase the release note)
        id: releasesign
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${CERT_P12:-}" ] && [ -n "${ASC_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Only when the macOS build is UNSIGNED (signing secrets absent): tell users
      # about Gatekeeper. Once signing + notarization is on, the app is
      # Gatekeeper-clean and this note is skipped.
      - name: Note the unsigned macOS build in the release body (idempotent)
        if: steps.releasesign.outputs.enabled != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          marker="ad-hoc signed"
          # Read the current body. If the read fails or the body is empty, SKIP rather
          # than risk clobbering the generated notes with only the appended fragment.
          if ! body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null)" || [ -z "$body" ]; then
            echo "::warning::Could not read a non-empty release body for $tag; skipping the unsigned-macOS note (not clobbering)."
          elif printf '%s' "$body" | grep -qF "$marker"; then
            echo "Unsigned-macOS note already present on $tag."
          else
            note=$'\n\n---\n> **macOS:** the `.app` is **ad-hoc signed** (unsigned for distribution). Gatekeeper will warn on first launch — right-click → Open, or run `xattr -dr com.apple.quarantine "Garlemald Client.app"`. Signing + notarization can be enabled by adding the secrets in docs/RELEASING.md ("macOS code signing").'
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "${body}${note}"
            echo "Appended the unsigned-macOS note to $tag."
          fi

      - name: Announce the release on Discord
        # Only on a real tagged release (push), not manual workflow_dispatch rebuilds,
        # so backfilling assets for an old tag doesn't re-announce it as "new".
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          PROJECT: Garlemald Client
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL secret is not set — skipping the Discord announcement."
            exit 0
          fi
          # Build the JSON with jq (--arg escapes every value) so the tag can never
          # break out of the shell or the JSON payload.
          payload="$(jq -n \
            --arg project "$PROJECT" \
            --arg tag "$TAG" \
            --arg url "$RELEASE_URL" \
            '{
              username: ($project + " Releases"),
              embeds: [{
                title: ($project + " " + $tag),
                description: ("A new " + $project + " release is available: " + $tag + "."),
                url: $url,
                color: 3447003
              }]
            }')"
          # A notification failure must not fail the release (assets are already attached).
          if curl -fsS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$payload"; then
            echo "Announced $TAG to Discord."
          else
            echo "::warning::Discord announcement for $TAG failed (webhook unreachable or rejected)."
          fi
